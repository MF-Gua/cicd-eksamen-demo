name: CI – cicd-eksamen-demo


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
build-and-test:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout kode
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # Hash-pinning: immutable SHA

    - name: Opsæt Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

        restore-keys: |
          linux-maven-          # Fallback

    - name: Byg og test med Maven
      run: mvn test -B --no-transfer-progress
